# SYNTHETIC TEST FIXTURE
hardware: testbox
domain: {shape: box, size: {ref: geometry.enclosure_internal_mm}}
obstacles:
  - {name: dish, shape: cylinder, D: {ref: geometry.dish_mm, index: 0}, H: {ref: geometry.dish_mm, index: 1}, center: [60, 40, 6]}
zones:
  - name: specimen
    shape: box
    size: [40, 40, 6]
    center: [60, 40, 15]
    sources:
      CO2: {rate: {ref: specimen_load.co2_flux}, unit: umol/s}
      heat: {rate: {ref: specimen_load.heat_W}, unit: W}
openings:
  - {name: inlet, role: inlet, face: xmin, size: [20, 20], center: [40, 40], flow_L_min: {ref: ventilation.flow_rate_L_min}}
  - {name: outlet, role: outlet, face: xmax, size: [20, 20], center: [40, 30]}
environment:
  temperature_C: {ref: environment.temperature_C}
  co2_ppm: {ref: environment.co2_ppm}
  rh_percent: {ref: environment.rh_percent}
numerics: {cell_mm: 4, surface_level: 0, obstacle_level: 1, end_time_s: 20, write_every_s: 5, max_dt_s: 0.5, probe_every_steps: 5}
assumptions:
  - {param: "obstacles[0].center", why: test}
  - {param: "zones[0].size", why: test}
  - {param: "zones[0].center", why: test}
  - {param: "openings[0].size", why: test}
  - {param: "openings[0].center", why: test}
  - {param: "openings[1].size", why: test}
  - {param: "openings[1].center", why: test}
