# Aquatic Habitat (JAXA) - one aquarium of the closed water loop (medium: water).
hardware: aqh
medium: water
domain: {shape: box, size: {ref: geometry.specimen_container_mm}}
openings:
  - {name: water_in,  role: inlet,  face: xmin, size: [20, 20], center: [35, 15], flow_L_min: {ref: ventilation.flow_rate_L_min}}
  - {name: water_out, role: outlet, face: xmax, size: [20, 20], center: [35, 55]}
environment:
  temperature_C: {ref: environment.temperature_C}
numerics: {cell_mm: 3.5, surface_level: 0, obstacle_level: 0, end_time_s: 1800, write_every_s: 150, max_dt_s: 1.0, max_co: 0.9, probe_every_steps: 20}
assumptions:
  - param: openings[0].size
    why: "Water inlet/outlet geometry of the aquarium is not published (aqh.yaml: 'aquarium water inlet/outlet geometry'). 20 x 20 mm ports assumed."
  - param: openings[0].center
    why: "Inlet low on one end wall, outlet high on the opposite end wall (assumed cross-flow arrangement)."
  - param: openings[1].size
    why: "As openings[0]."
  - param: openings[1].center
    why: "As openings[0]."
  - param: domain.water_only
    why: "The aquarium is modelled full of water; the air pocket of the air-water interface ('air stabilizer') and the fish are not represented (no dimensions or O2 uptake sourced). Walls held at the set-point temperature; no heat sources, so 0 g and 1 g are expected to coincide."
