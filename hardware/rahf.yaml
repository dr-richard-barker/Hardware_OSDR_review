thermal:
  power_W:
    value: 324
    unit: W
    source: "NASA TM-89289 (1987) p. 25, NTRS 19870012958"
    url: https://ntrs.nasa.gov/citations/19870012958
    quote: "324 W continuous operation; maximum thermal load is 850 BTU/hr for each RAHF"
    kind: specified
    note: "850 BTU/hr = 249 W (derived). RAHF total weight 280 kg (same page)."

searched: |
  OSDR registry 589 (all components/versions); NASA TM-89289 LSLE catalog (NTRS 19870012958, page image checked);
  NASA TM-102237 (NTRS 19900002835); NASA TM-88212 Spacelab-3 animal studies (NTRS 19860007419, no env values);
  Fuller et al. Neurolab circadian report (NTRS 20030068223); OSDR OSD-422/423 protocol text; Liu et al. 2009 comparison
  table; NTRS 19920039257 (SLS-1 RAHF performance; abstract only, no full text); SAE 951478 (paywalled, not opened).
  No SPLASH record. Missing: cage temperature/RH setpoints and flight values, whole-cage dimensions, per-cage flow split.
