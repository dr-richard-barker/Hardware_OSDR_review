ventilation:
  mode:
    value: forced
    unit: "-"
    source: "NASA Ames, Bioculture System brochure (2021), NTRS 20210021796, Specifications page"
    url: https://ntrs.nasa.gov/citations/20210021796
    quote: "Positive pressure airflow within the system"
    kind: specified
    note: >-
      Specimens are liquid-perfused. Gas (typically 20% O2, 5-10% CO2, balance N2) is dosed through a sealed
      membrane oxygenator: "Each flow path contains the oxygenator that employs a series of silicone flow loops
      to provide gas exchange across the semipermeable tubing into the circulated culture medium." CS-04
      overview (NTRS 20205008330) labels an "Air Shroud" and "Double Immersion Breathers" on the cassette.
      Gas dosing rate is programmable; no numeric value found (Monhollon et al. NTRS 20160014798 measured valve
      dose volumes for 80-300 ms actuations - values only in a chart).
  flow_rate_L_min:
    value: null
    unit: L/min
    note: "Gas supply rate not found. Liquid perfusion in medium_flow_rate_mL_min."
  medium_flow_rate_mL_min:
    value: [0, 8]
    unit: mL/min
    source: "NASA Ames, Bioculture System brochure (2021), NTRS 20210021796, Specifications page"
    url: https://ntrs.nasa.gov/citations/20210021796
    quote: "Pump (0-8 mL/min flow rate)"
    kind: specified
    note: >-
      CONFLICT: earlier presentations (NTRS 20140010811, ASGSR 2013; NTRS 20140010685) give "User selectable
      fluid flow/pump rate - 0 to 15 ml/min". The 2021 brochure is the later, flight-heritage specification and
      is used. Recirculating volume ~60 mL (brochure).
  recirculating_medium_mL:
    value: 60
    unit: mL
    source: "NASA Ames, Bioculture System brochure (2021), NTRS 20210021796"
    url: https://ntrs.nasa.gov/citations/20210021796
    quote: "In this fluidics route, approximately 60ml of media is continuously circulated through the bioreactor to exchange waste for nutrients."
    kind: specified
  inlet:
    value: null
  outlet:
    value: null

environment:
