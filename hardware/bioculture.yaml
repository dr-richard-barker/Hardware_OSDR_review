    value: 37
    unit: degC
    source: "NASA Ames, Bioculture System brochure (2021), NTRS 20210021796"
    url: https://ntrs.nasa.gov/citations/20210021796
    quote: "In most cases, the Bioculture System is programmed to maintain a constant 37°C environment. However, set point of the incubator side of the cassette can be adjusted from ambient temperature to 42°C."
    kind: specified
    note: >-
      Specification: "Module temperature: Ambient to +42°C±1.0°C"; "Cooling chamber temperature: Ambient to
      +5°C±1.0°C". SPLASH _id 17: operational_temperature "15 - 37C", temperature_range "15-40C depending on
      ambient" (minor conflict on upper limit).
