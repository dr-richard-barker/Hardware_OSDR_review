    source: "NASA Ames, Bioculture System brochure (2021), NTRS 20210021796"
    url: https://ntrs.nasa.gov/citations/20210021796
    quote: "The Bioculture System can be outfitted with its own gas supply typically consisting of 20% O2, 5-10% CO2, and balanced with N2."
    kind: specified
    note: "Supply-gas composition, not measured headspace. Monhollon et al. (NTRS 20160014798) ground test used 10% CO2: 'Maintenance is done by addition of gas (10% CO2) to flow path.'"
