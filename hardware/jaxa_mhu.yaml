entity_id: HW105
name: JAXA Mouse Habitat Unit (MHU) - Habitat Cage Units (HCU) in CBEF / CBEF-L (MARS centrifuge)
splash_ids: [105]
registry_ids: []

location:
  value: "ISS Kibo (JEM), Centrifuge-equipped Biological Experiment Facility: 6 HCU in the micro-g section + 6 HCU on the 0.3 m-diameter centrifuge"
  unit: "-"
  source: "Shiba D. et al. (2017) Development of new experimental platform 'MARS' - Multiple Artificial-gravity Research System - to elucidate the impacts of micro/partial gravity on mice. Sci Rep 7:10837. doi:10.1038/s41598-017-10998-4"
  url: https://doi.org/10.1038/s41598-017-10998-4
  quote: "As this compact onboard centrifuge is only 0.3 m in diameter, we consequently developed new mouse Habitat Cage Units (HCU) (Fig. 1a)."
  kind: specified
  note: "Full text via Europe PMC (PMC5589811). JAXA MHU page: 'six mouse cages are set in the microgravity compartment (upper part) and the 1-G compartment (lower part)'. 1 g at the HCU floor = 77 rpm (Shiba 2017). Later missions used CBEF-L (OSD-714)."

geometry:
  enclosure_internal_mm:
    value: null
    unit: mm
    note: >-
      L x W x H not published in sources opened. The HCU 'is shaped in a hollow cylinder section' (Shimbo 2016);
      Shiba 2017 Supplemental Table 1 gives 'Floor area: 1.022x10-2 m2' and 'Diagonal length: 0.127 m'; Shimbo 2016 Table 1
      gives floor area 101 cm2 and capacity 560 cm3 -> mean clear height 560/101 = 5.5 cm (derived). Enough for a
      floor-area/volume-equivalent box, not for true geometry.
  free_air_volume_L:
    value: 0.56
    unit: L
    source: "Shimbo M. et al. (2016) Ground-based assessment of JAXA mouse habitat cage unit by mouse phenotypic studies. Exp Anim 65(2):175-187. doi:10.1538/expanim.15-0077"
    url: https://doi.org/10.1538/expanim.15-0077
    quote: "The floor area and volume of the cage area in the HCU (101 cm2, 560 cm3) is smaller than that of the control cage (Inocage, 552 cm2, 7,256 cm3)."
    kind: specified
    note: "Per HCU (one mouse). Full text via Europe PMC (PMC4873486); Table 1 image also lists 'Capacity 560 cm3'. Breadboard/ground HCU model used in this study."
  specimen_container:
    value: "single-mouse Habitat Cage Unit, polycarbonate floor/walls, hollow-cylinder-section shape, perforated floor"
    unit: "-"
    source: "Shimbo M. et al. (2016) Exp Anim 65(2):175. doi:10.1538/expanim.15-0077"
    url: https://doi.org/10.1538/expanim.15-0077
    quote: "In order to conduct a comparison experiment entailing microgravity and artificial gravity of 1 g, the HCU is shaped in a hollow cylinder section to be installed in the CBEF"
    kind: specified
  specimen_container_mm:
    value: "floor area 1.022e-2 m2; diagonal length 0.127 m"
    unit: "-"
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplementary Information, Supplemental Table 1"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "Floor area: 1.022×10-2 m2 Diagonal length: 0.127 m"
    kind: specified
    note: "Consistent with Shimbo 2016 (101 cm2). Transportation Cage Unit (TCU, launch/return only): 12 cylindrical cages, 'Diameter: 0.055 m Length 0.154 m', same fan spec, 60 lux."
  n_specimen_units:
    value: 12
    unit: "HCU (1 mouse each) per mission: 6 micro-g + 6 artificial-g"
    source: "Shiba D. et al. (2017) Sci Rep 7:10837"
    url: https://doi.org/10.1038/s41598-017-10998-4
    quote: "On the ISS, the mice were divided into two groups of six mice each."
    kind: specified
    note: "Shiba 2017 Fig. 1 caption: 'The HCU accommodates one mouse per cage.' SPLASH 105: '6 mice per gravity condition, 24 total' (four gravity conditions across MARS missions)."
  layout:
    value: "6 HCU on the CBEF centrifuge (artificial g; 77 rpm for 1 g at the HCU floor) + 6 HCU in the micro-g section"
    unit: "-"
    source: "Shiba D. et al. (2017) Sci Rep 7:10837"
    url: https://doi.org/10.1038/s41598-017-10998-4
    quote: "One group (artificial 1 g mice; AG) was kept in an artificial 1 g environment (1 g on the bottom floor of the HCU, at a centrifugation 77 rpm); the other group (μg mice; MG) was kept under μg."
    kind: specified

ventilation:
  mode:
    value: forced
    unit: "-"
    source: "Shiba D. et al. (2017) Sci Rep 7:10837"
    url: https://doi.org/10.1038/s41598-017-10998-4
    quote: "Air ventilation inside the cage was maintained by airflow (<0.2 m/s) generated by fans on the HCU."
    kind: specified
    note: "Two fans per HCU (redundancy); airflow also carries faeces/urine to the floor holes and absorbent paper in micro-g. Source of supply air (CBEF internal air) and its conditioning not described."
  flow_rate_L_min:
    value: 8.8
    unit: L/min
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplemental Table 1"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "Volume of air ventilation: 8.8l/min Wind velocity: 0.2 m/s in maximum"
    kind: specified
    note: "Per HCU; about 15.7 cage volumes per minute for the 0.56 L cage (derived)."
  air_velocity_m_s:
    value: 0.2
    unit: m/s
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplemental Table 1"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "Volume of air ventilation: 8.8l/min Wind velocity: 0.2 m/s in maximum"
    kind: specified
    note: "Maximum. Shimbo 2016 and OSD-457/690 (MHU-3 ground control) give 0.2 m/s; OSD-288/532 and main text give <0.2 m/s. Fan speed identical in micro-g and centrifuge HCUs (Shiba 2017)."
  inlet:
    value: null
    unit: "-"
    note: "Inlet position/area not found."
  outlet:
    value: "floor perforated with 5 mm holes into the waste-collecting equipment; activated-carbon odour filter"
    unit: "-"
    source: "Shimbo M. et al. (2016) Exp Anim 65(2):175. doi:10.1538/expanim.15-0077"
    url: https://doi.org/10.1538/expanim.15-0077
    quote: "many circular holes (5 mm in diameter, Fig. 1C) are left open in a regular fashion at the bottom of the HCU cage, with the assistance of a ventilation fan having a regulated noise level of 60 dB."
    kind: specified
    note: "Odour filter = activated carbon (Shiba 2017 Supplemental Table 1). Hole count/pitch not given."

environment:
  temperature_C:
    value: [22.5, 24.0]
    unit: degC
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplemental Table 3 (MHU-1, on-orbit)"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "HCU telemetry N/A 22.8-23.8 (AVE 23.1) 22.5-24 (AVE 22.7)"
    kind: measured
    note: "Columns: launch / on-orbit AG / on-orbit MG. CBEF air 22-24.5 C (avg 23.1). MHU-2 (OSD-686): 'the temperature was controlled at 23 +/- 3 C in flight'. TCU launch avg 25.8 C, return avg 26.1 C (up to 30 C)."
  rh_percent:
    value: [42, 52]
    unit: "%"
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplemental Table 3 (MHU-1, CBEF logger)"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "Humidity (Relative humidity; %) CBEF N/A 42-48 (AVE 44.7) 43-52 (AVE 47.4)"
    kind: measured
    note: "CBEF (not in-cage). MHU-2 (OSD-686): 'humidity was controlled at 40 +/- 15% in flight'."
  co2_ppm:
    value: [2400, 4200]
    unit: ppm
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplemental Table 3 (MHU-1)"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "Carbon dioxide concentration (%) HCU telemetry N/A 0.24-0.37 (AVE 0.32) 0.28-0.42 (AVE 0.36)"
    kind: measured
    note: "0.24-0.42 % converted to ppm (x10000). Main text says CO2 was measured 'by a sensor inside the CBEF'. MHU-2 (OSD-686): 0.29 % (AG) and 0.33 % (MG). NH3 0-0.88 ppm."
  o2_percent:
    value: null
    unit: "%"
    note: "Not reported."
  pressure_kPa:
    value: null
    unit: kPa
    note: "ISS cabin; not reported."
  light:
    value: "LED, 50 lux, 12:12 h light/dark; IR LEDs for night video"
    unit: lux
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplemental Table 1"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "LED 50 lux (12-12 h light dark cycle)"
    kind: specified
    note: "Shimbo 2016: 'approximately 50 lux'. JAXA MHU page: 'visible and infrared LED illumination'."

nutrients:
  mode:
    value: food_bar+lixit
    unit: "-"
    source: "Shiba D. et al. (2017) Sci Rep 7:10837"
    url: https://doi.org/10.1038/s41598-017-10998-4
    quote: "The HCU is equipped with a food bar, watering system (two redundant water nozzles and a water balloon acting as power-free pressure source), an odour filter, two fans (for redundancy) for air ventilation"
    kind: specified
    note: "Nozzles: A1400 (Edstrom). Drinking nozzles rather than lixits proper; 'lixit' used here as the schema category for valve-type drinkers."
  detail:
    value: "35 g block food bar (cartridge), 70 mL water tank per HCU; 7-day supply, replaced by crew"
    unit: "-"
    source: "Shiba D. et al. (2017) Sci Rep 7:10837, Supplemental Table 1"
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41598-017-10998-4/MediaObjects/41598_2017_10998_MOESM1_ESM.pdf
    quote: "Food type/weight Block/35 g, Cartridge type Cylindrical/70 g"
    kind: specified
    note: "Columns HCU / TCU (35 g block for HCU, 70 g cylinder for TCU). Water tank 70 mL (HCU) / 140 mL (TCU). Main text Fig. 1: 'A 7-day supply of food and water is provided inside the HCU.'"

specimen_load:
  o2_flux:
    value: 3.63
    unit: "mL O2 h-1 per g body mass (C57BL/6 mouse)"
    source: "Niederwieser T. et al. (2014) AEM-E - A small life support system for the transport of rodents to the ISS. ICES-2014-101"
    url: http://hdl.handle.net/2346/59702
    quote: "O2 = 3.63 mL O2/(hr g) measured at 16 weeks vs. 5.06 mL O2/(hr g) design load"
    kind: measured
    note: "Organism-level C57BL/6 value measured at 16 weeks (both sexes). MHU-1 flew male C57BL/6J that were 8 weeks old at launch (Shiba 2017) - age mismatch. Multiply by the mission body mass for a per-mouse source."
  co2_flux:
    value: 2.29
    unit: "mL CO2 h-1 per g body mass (C57BL/6 mouse)"
    source: "Niederwieser T. et al. (2014) ICES-2014-101"
    url: http://hdl.handle.net/2346/59702
    quote: "for CO2 = 2.29 mL CO2/(hr g) measured at 16 weeks vs. 4.63 mL CO2/(hr g) design load"
    kind: measured
    note: "Implied RQ 0.63 (low); conservative design value 4.63 mL/(h g)."
  h2o_flux:
    value: 7.3
    unit: "g H2O vapour h-1 per kg body mass (mouse cage, BALB/c)"
    source: "Riskowski G.L., Harrison P.C., Memarzadeh F. (2006) ASHRAE Transactions 112(1), paper 4835"
    url: https://orf.od.nih.gov/TechnicalResources/Bioenvironmental/Documents/MassGenerationRatesofAmmoniaMoistureandHeatProduct.pdf
    quote: "When vapor production is converted to a body weight basis, the BALB/c mice are greater than the CD-1 (7.3 vs. 6.3 (g/h)/kg BW"
    kind: measured
    note: "Cage-level (includes evaporation from urine/bedding) at 24 C. HCU uses absorbent paper sheets instead of bedding."
  heat_W:
    value: 15.7
    unit: "W per kg body mass (BALB/c mouse)"
    source: "Riskowski G.L., Harrison P.C., Memarzadeh F. (2006) ASHRAE Transactions 112(1), paper 4835"
    url: https://orf.od.nih.gov/TechnicalResources/Bioenvironmental/Documents/MassGenerationRatesofAmmoniaMoistureandHeatProduct.pdf
    quote: "Heat production on a body mass basis was calculated to be 17.9 and 15.7 W/kg BW (27.7 and 24.3 Btu/h/lb BW) for CD-1 and BALB/c mice, respectively."
    kind: measured
    note: "At 24 C, similar to the 22.5-24 C HCU telemetry."

walls:
  material:
    value: "polycarbonate (floor and walls); liquid-absorbing paper sheets (PulSheet) with photocatalytic spray on walls"
    unit: "-"
    source: "Shimbo M. et al. (2016) Exp Anim 65(2):175. doi:10.1538/expanim.15-0077"
    url: https://doi.org/10.1538/expanim.15-0077
    quote: "As in the conventional mouse cages, the internal materials of the walls and floor of the HCU are made of polycarbonate."
    kind: specified
    note: "Paper sheets: Shiba 2017 Supplemental Table 1 ('Liquid absorbing paper) PulSheet Oriental Yeast Co., ltd')."
  gas_permeability:
    value: null
    unit: "-"
    note: "Polycarbonate permeability not reported; walls effectively impermeable on CFD time scales (assumption, not sourced)."

thermal:
  power_W:
    value: null
    unit: W
    note: "Not found."

searched: |
  SPLASH 105 (no dims/power); Shiba et al. 2017 (PMC5589811) + Supplementary Information PDF (Tables 1 and 3);
  Shimbo et al. 2016 Exp Anim (PMC4873486, Table 1 image); JAXA MHU pages (iss.jaxa.jp/en/kiboexp/pm/mhu/ and
  MHU-4 news - no numeric specs); OSDR protocol text OSD-288, 457, 532, 686, 690, 714. Missing: HCU L x W x H / true
  curved geometry, inlet location, CBEF supply-air conditions, centrifuge radius to HCU floor, power.
