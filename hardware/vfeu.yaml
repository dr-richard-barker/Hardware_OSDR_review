    note: "Not found."

environment:
  temperature_C:
    value: 14
    unit: degC (water)
    source: "JAXA, STS-90 NASDA equipment page (Neurolab VFEU)"
    url: https://iss.jaxa.jp/shuttle/flight/sts90/sts90eqp_nasda_e.html
    quote: "Temp. Control: 10 - 25 (14 1 for the experiment)"
    kind: specified
    note: >-
      Page text has lost the degree and plus-minus glyphs (encoding); reads 10-25 degC range, 14 ± 1 degC
      for the experiment. Sakimura 1999: "The required water measurement temperature for fish maintenance was
      14 degree C." MEASURED (STS-90): NASDA water-analysis attachment in Neurolab Final Report (p.131) notes
      a period "when the water temperature was fluctuated between 13-to 15 deg. C".
  rh_percent:
    value: null
    note: "Not applicable (water medium). Spacelab dew point 16 degC drove insulation of FP/water loop (Sakimura 1999)."
  co2_ppm:
    value: null
    note: "Not found."
  o2_percent:
    value: null
    note: "Dissolved O2 maintained by artificial lung + air pump; no values found."
  pressure_kPa:
    value: null
    note: "Water pressure recorded by the Data Recorder (registry 924) but no values found."
  light:
    value: "day/night light cycle (lamp window on FP); schedule not found"
