  light:
    value: 'BRIC-LED-001: 85% red / 15% blue, 60 umol m-2 s-1, 4 h light / 2 h dark, 10 d'
    unit: '-'
    source: Olanrewaju GO, Haveman NJ, Naldrett MJ, Paul A-L, Ferl RJ, Wyatt SE (2023) Integrative transcriptomics
      and proteomics profiling of Arabidopsis thaliana elucidates novel mechanisms underlying spaceflight adaptation.
      Front. Plant Sci. 14:1260429. doi:10.3389/fpls.2023.1260429
    url: https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2023.1260429/full
    quote: with a light wavelength composition of 85% red, 15% blue, and 60 µmol m −2 s −1 intensity.
    kind: specified
    note: 'Photoperiod from same paper: "The plants were grown for 10 days with a 4-hour/2-hour light-dark cycle".
      CONFLICT: registry 2021 says "The hardware cycles between 4 hours of light and dark periods to prevent overheating";
      OSD-522 adds "lighting could not be maintained longer than 4 hours at a time".'
  light_capability:
    value: 4 LED types per dish (blue, red, far-red, white; 430-750 nm); up to 55 umol m-2 s-1 at 1 degC canister
      spread (capable >150); >70% uniformity
    unit: '-'
    source: Caron AR (2016) Biological Research in Canisters - Light Emitting Diode (BRIC-LED). ISS R&D Conference
      presentation, 11 July 2016; NTRS 20160009001
    url: https://ntrs.nasa.gov/api/citations/20160009001/downloads/20160009001.pdf
    quote: Up to 55 µmol/m2/s while maintaining 1°C between Canisters • capable of >150 µmol/m2/s
    kind: specified
    note: 'Same slide: "currently ranging from 430-750nm (blue, red, white and far-red)", ">70% light uniformity",
      "Light tight from external sources".'
nutrients:
  mode:
