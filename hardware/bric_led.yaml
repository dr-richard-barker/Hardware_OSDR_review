    source: Levine HG, Caron A (2016) Biological Research in Canisters (BRIC) - Light Emitting Diode (LED). NASA
      KSC poster; NTRS 20160009021
    url: https://ntrs.nasa.gov/api/citations/20160009021/downloads/20160009021.pdf
    quote: Briefly, biological specimens are placed onto (or into) 60 mm petri dishes containing agar-solidified
      media, although alternative approaches will be considered.
    kind: specified
  detail:
    value: 'BRIC-LED-001: ~30 Arabidopsis seeds per 60 mm plate on 6.7 mL medium'
    unit: '-'
