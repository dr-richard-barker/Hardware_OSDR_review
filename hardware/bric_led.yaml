specimen:
  types:
    value: plant seedlings, callus cultures, C. elegans, microbes
    unit: '-'
    source: Levine HG, Caron A (2016) Biological Research in Canisters (BRIC) - Light Emitting Diode (LED). NASA
      KSC poster; NTRS 20160009021
    url: https://ntrs.nasa.gov/api/citations/20160009021/downloads/20160009021.pdf
    quote: A diverse range of organisms can be supported, including plant seedlings, callus cultures, Caenorhabditis
      elegans, microbes, and others.
    kind: specified
    note: 'Flown: BRIC-LED-001 Arabidopsis thaliana seedlings (OSD-522, SpaceX-13/14).'
ventilation:
  mode:
    value: sealed (specimen PDFU/canister); canisters cooled externally by forced air in the tray
    unit: '-'
    source: ISS National Lab facility page "Biological Research In Canisters" (text extracted with WebFetch; site
      blocks direct download)
    url: https://issnationallab.org/?p=42263
    quote: BRIC-PDFUs and BRIC-LEDs are aluminum boxes with sealed lids that house biological specimens
    kind: specified
    note: 'Supporting statements: Caron 2016 lists "PDFU and Canister Leak Tests; proving containment" and "3 levels
      of containment"; canister pressure is telemetered (Levine & Caron 2016). Nicholson et al. 2021 (BRIC-PDFU)
      state PDFUs are "hermetically sealed". An explicit gas-exchange specification for the BRIC-LED PDFU was not
      found. ISS National Lab quote extracted via WebFetch.'
  flow_rate_L_min:
    value: null
    unit: L/min
    note: Not applicable inside the sealed canister. Cooling-air flow rate of the tray (EXPRESS AAA air) not sourced.
  inlet:
    value: Forced-air cooling of tray/canisters using EXPRESS rack avionics (AAA) air (external to specimen volume)
    unit: '-'
    source: Caron AR (2016) Biological Research in Canisters - Light Emitting Diode (BRIC-LED). ISS R&D Conference
      presentation, 11 July 2016; NTRS 20160009001
    url: https://ntrs.nasa.gov/api/citations/20160009001/downloads/20160009001.pdf
    quote: Forced air cooling to reject heat – 1°C between Canisters – 3°C from EXPRESS AAA air
    kind: specified
    note: Inlet/outlet geometry and airflow not sourced.
  outlet:
    value: null
    note: Not sourced.
environment:
  temperature_C:
    value: surrounding (EXPRESS AAA) air +/- 3
    unit: degC
    source: Levine HG, Caron A (2016) Biological Research in Canisters (BRIC) - Light Emitting Diode (LED). NASA
      KSC poster; NTRS 20160009021
    url: https://ntrs.nasa.gov/api/citations/20160009021/downloads/20160009021.pdf
    quote: Temperature will be controlled to ± 3°C of the surrounding air temperature, with no more than a 1.5°C
      differential between canisters, using forced air cooling.
    kind: specified
    note: 'CONFLICT: Caron 2016 slides give "1°C between Canisters" (vs 1.5 °C). BRIC-LED-001 seedlings were "placed
      at ambient temperature aboard the ISS" (Olanrewaju 2023); no logged values found.'
