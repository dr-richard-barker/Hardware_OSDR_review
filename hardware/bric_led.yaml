      Front. Plant Sci. 14:1260429. doi:10.3389/fpls.2023.1260429
    url: https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2023.1260429/full
    quote: Approximately 30 seeds were plated on each 60mm round petri plate containing 6.7ml of 0.5× + Benomyl
      Murashige and Skoog (MS) growth media
    kind: specified
    note: 'PI-supplied agar volume for the "BRIC  60 mm round dish": 10-15 mL (dishes.ts, 2026-10-08) - conflicts
      with 6.7 mL used on BRIC-LED-001.'
