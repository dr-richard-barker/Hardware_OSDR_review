    unit: ppm
    note: Not sourced; no CO2 control (sealed at integration with ambient air).
  o2_percent:
    value: null
    unit: '%'
    note: Not sourced; O2 limited to the air sealed in at integration (Nicholson 2021).
  pressure_kPa:
    value: null
    unit: kPa
    note: Not sourced.
  light:
    value: dark (light-tight PDFU lid)
    unit: '-'
    source: OSDR study OSD-44 protocol/description (biodata API, snapshot 2026-10-12)
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-44/
    quote: After planting, a single Petri dish was inserted into a Petri Dish Fixation Unit (PDFU) and sealed with
      a light-tight metal lid.
    kind: specified
    note: 'Millar 2011 (BRIC-16): "Both flight and ground experiments were performed in darkness." The light-capable
