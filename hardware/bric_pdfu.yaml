nutrients:
  mode:
    value: agar (seedlings, cell cultures) or injected liquid medium (microbes)
    unit: '-'
    source: OSDR study OSD-38 protocol/description (biodata API, snapshot 2026-10-12)
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-38/
    quote: Biological specimens are placed into the 60 mm Petri dishes containing agar-solidified media, although
      alternative approaches will be considered.
    kind: specified
  detail:
    value: medium depth <= 5 mm (~6.7 mL per 60 mm dish)
    unit: '-'
    source: OSDR study OSD-147 protocol/description (biodata API, snapshot 2026-10-12)
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-147/
    quote: The media in the plates for BRIC had to be 5mm deep or less to accommodate the biology and the PDFU cover
      hardware.
    kind: specified
    note: 'Same protocol: "For a 60mm dish, this calculates out to 6.7 mLs." CONFLICT with other flights: BRIC-19
      planted on 15 mL Phytagel medium per 60 mm dish (OSD-37); PI-supplied agar volume 10-15 mL (dishes.ts, 2026-10-08);
      liquid cultures 8.5 mL TSY (BRIC-23).'
