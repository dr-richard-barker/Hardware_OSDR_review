searched: |
  Opened this session: OSDR registry 2020 + payloads BRIC-16..25; SPLASH #25; OSDR protocols OSD-17/37/38/44/121/138/145/147/185/205/321/500;
  Millar et al. 2011 (PMC3233217); Fajardo-Cavazos & Nicholson 2016 (GSR 4(2)); Nicholson et al. 2021 (Front Space Technol);
  Wells et al. 2001 SAE 2001-01-2286 (abstract only - full text paywalled); NASA feature Granath 2013; NASA SMD plant hardware page;
  ISS National Lab BRIC page; NTRS search "Biological Research in Canisters" / "Petri Dish Fixation Unit" (no PDFU fact sheet;
  NTRS 20100027517 abstract has no dimensions).
  Missing: canister INTERNAL dimensions and free volume; PDFU block dimensions and dish-chamber headspace for agar plates;
  organism gas-exchange loads. Wells et al. 2001 (SAE) is the most likely primary source for PDFU drawings.
  Note: OSD-17/147/205 protocols (BRIC-16/17, 2010/2013) say the hardware was "the NASA BRIC-LED" with the LED component
  disabled. The SAE 2001 abstract shows a 1990s "BRIC-LED ... PDFU apparatus" existed, distinct from the 2016-2018 BRIC-LED
  facility (HW246); OSDR registry links these payloads to BRIC-PDFU (2020). Treated here as BRIC-PDFU.
