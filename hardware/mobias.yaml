searched: |
  OSDR snapshot 2026-10-12 (SPLASH _id 121; registry hardware 1403 and 1173 (GAP); experiment OS-526; payload
  12A; biodata OSD-11/15/20). Wilson et al. 2007 PNAS (PMC2042201, Microbe/STS-115 methods). NASA Ames Microbe
  (STS-115) page. Hoehn, Klaus & Stodieck 2004 J Gravit Physiol abstract (CGBA/ICM family). Web, NTRS
  (0 hits for MOBIAS) and Europe PMC searches. DATA-QUALITY FLAG: SPLASH _id 121 specimen_size reads
  "Workbench (WB): Fold-out 0.5 m² workspace", which does not describe a bioreactor - treated as misattributed
  and not used. Not found: any MOBIAS engineering paper, bag geometry/volume, incubator dimensions, feed rates,
  verified flight.
