    unit: "-"
    source: "NASA OSDR SPLASH instrument catalogue, record _id 121 / registry 1403"
    url: https://visualization.osdr.nasa.gov/splash-api/public/instruments/121
    quote: "It uses long, thin gas-permeable bags and automated fluid exchange to support diffusion-based bioprocessing without agitation mechanisms."
    kind: specified
    note: >-
      Gas exchange is by diffusion through bag walls (registry 1403: "In addition to providing gas exchange,
      fresh nutrient medium addition and waste removal"). Whether the surrounding incubator air is circulated
      is not documented. BioServe ICM family (Hoehn et al. 2004 abstract): "passive gas exchange can be
      provided through hydrophobic membranes" - generic to the hardware family, not MOBIAS-specific.
