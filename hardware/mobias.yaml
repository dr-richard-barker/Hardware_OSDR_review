entity_id: HW121
name: Multiple Orbital Bioreactor with Instrumentation and Automated Sampling (MOBIAS)
vendor: BioServe Space Technologies, University of Colorado Boulder
splash_ids: [121]
registry_ids: ["1403"]
curated: "2026-10-12"

location:
  value: "Inside a BioServe incubator: modified Isothermal Containment Module (ICM v.3) per registry; CGBA per SPLASH"
  unit: "-"
  source: "NASA OSDR hardware registry, record 1403 (MOBIAS), description"
  url: https://osdr.nasa.gov/geode-py/ws/api/hardware/1403
  quote: "MOBIAS is housed within a modified ICM v.3 for computer and thermal control."
  kind: specified
  note: >-
    SPLASH _id 121 background: "MOBIAS was never used outside of the CGBA incubator." (ICM is part of the CGBA
    family per Hoehn et al. 2004 J Gravit Physiol 11(1):39-49, so the two statements may be consistent.)
    FLIGHT-HISTORY CONFLICT: registry links MOBIAS to STS-115 'Microbe' (payload 12A: "12 flight Group
    Activation Packs were flown in the MOBIAS hardware"), but the NASA Ames Microbe page and Wilson et al. 2007
    PNAS (PMC2042201) describe hand-crank-activated GAPs in the Shuttle middeck with no mention of MOBIAS
    ("the experiment was activated by use of a hand crank that was installed onto the top of the Group
    Activation Pack hardware"). OSD-11/15/20 should therefore NOT be modelled as MOBIAS without further evidence.

