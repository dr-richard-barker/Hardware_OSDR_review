searched: |
  Opened: SPLASH #37; OSDR registry 2048; JAXA Handbook for Use of Laboratory in Kibo (E-version Feb 2014, PEU and
  CBEF sections); JAXA BEU and CBEF web pages; Yano 2020 BSJ-Review 11:106-119 (Japanese); Space Seed report (JAXA
  repository 13115; Japanese body garbled in text layer, English abstract used); Kato et al. 2022 Plants (PMC8837939);
  Plants 2022 11:956 (PMC9003378, Petri-dish PEU use); Europe PMC abstracts of JAXA hardware papers. Not accessible:
  Yano et al. 2013 Adv Space Res 51:780-788 (PEU improvements) and Yano et al. 2012 Biol Sci Space 26:12-20 (CBEF
  thermal; J-STAGE returned an HTML stub). Not found: ventilation-pump flow rate, exhaust path, CO2 used in plant
  runs, chamber wall material, power.
