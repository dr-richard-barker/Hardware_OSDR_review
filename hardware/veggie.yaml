thermal:
  power_W:
    value: 70
    unit: W
    source: "NASA Facts: Veggie, FS-2020-01-007-KSC (2020)"
    url: https://www.nasa.gov/wp-content/uploads/2019/04/veggie_fact_sheet_508.pdf
    quote: "Veggie runs on about 70 watts for the lights, fans and control electronics."
    kind: specified
    note: >-
      Total electrical power (approximate). The LED light cap has 'a separate air cooling loop' from the
      EXPRESS rack (Massa et al. NTRS 20160006558), so not all 70 W is released into the growth volume.
      OSD-655: the black pillows absorb light and the blue-rich recipe added ~15% more energy than red-rich at
      the same PPF; white Beta-cloth shades blocked 62% of light on the pillow surface.

