searched: |
  OSDR registry 1380; Choi et al. 2020 Sci Rep (PMC7012842); ICES-2014-101 (Niederwieser et al., TTU repository,
  text read in the browser); BioServe AEM-E web page (capacity 40 mice/12 rats, up to 10 days, middeck locker, rear
  breathing); NTRS 20190000828 ('Transporter houses 20 mice or 5 rats'); ICES-2014 oxygen-resupply paper (Tozer et al.;
  not opened); Holquist et al. ICES 2013 design-trades paper (cited, not opened); ISS National Lab facility pages (HTTP
  403/404). No SPLASH record. Missing: chamber dimensions, per-side flow split, inlet/outlet geometry, light level, power.
