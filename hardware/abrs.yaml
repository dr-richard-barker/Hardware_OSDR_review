  light:
    value: "LED panel in chamber top, 303 LEDs, PWM 50-300 umol m-2 s-1, peaks 470 and 660 nm plus minor green/white; set to 180 umol m-2 s-1 at top of upper-tier plates (~half at imaging plate 12 cm lower)"
    unit: '-'
    source: "Paul, Amalfitano, Ferl (2012) BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "control of light intensity from 50 to 300 μmol m-2 s-1, and provided a spectrum of photosynthetically available light (peaks at 470 and 660nm) plus minor green and white light components."
    kind: specified
    note: "Same source: 'The upper tier plates received approximately 180 μmol m 2 s -1, while the lower tier plates received about half that.' Lower-tier plate 1 cited at 80 umol m-2 s-1."

nutrients:
  mode:
    value: agar
    unit: '-'
    source: "Paul, Amalfitano, Ferl (2012) BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "The foundational growth medium for Arabidopsis plants on orbit was phytagel in standard 100mm square Petri plates."
    kind: specified
  detail:
    value: "phytagel (gellan) nutrient medium in sealed-lid Petri plates; seedlings grow along the gel surface; no active watering"
    unit: '-'
    source: "Paul, Amalfitano, Ferl (2012) BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "Phytagel is a solid, non-friable, water and nutrient delivery system ideal for microgravity environments in that water and nutrient delivery are passive and consistent."
    kind: specified
    note: "Whether plate lids were taped/sealed and how gas exchanges with the plate interior is not stated in the sources opened."

