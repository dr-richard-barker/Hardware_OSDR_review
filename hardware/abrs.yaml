# Advanced Biological Research System (ABRS) - curated 2026-10-12
# Every non-null value carries a verbatim quote from a source opened in the curation session.
entity_id: HW064
name: Advanced Biological Research System (ABRS)
splash_ids: [64]
registry_ids: []

location:
  value: "ISS EXPRESS rack (EXPRESS Rack 2), single middeck-locker-equivalent sub-rack facility; also Shuttle-middeck compatible"
  unit: '-'
  source: "SPLASH instrument #64 (ABRS), background field"
  url: https://visualization.osdr.nasa.gov/splash-api/public/instruments/64
  quote: "ABRS fits within either asingle rear-breathing Space Shuttle middeck locker or an ISS EXPRESS Rack"
  kind: specified
  note: "Cox D.R. (2010) ASGSB slides (NTRS 20110942664): 'Single Middeck Locker Equivalent' and photo caption 'ABRS Installed in EXPRESS Rack 2'. Status 'Legacy' in SPLASH; returned on SpX-5 (Dec 2014 ISS status reports, secondary)."

geometry:
  enclosure_internal_mm:
    value: [202, 133, 192]
    unit: mm
    source: "SPLASH instrument #64 (ABRS), specimen_size field"
    url: https://visualization.osdr.nasa.gov/splash-api/public/instruments/64
    quote: "20.2L 13.3W 19.2H cm growth chamber"
    kind: specified
    note: >-
      One Experiment Research Chamber (ERC); [L, W, H]. Corroborated by the ERC detail drawing in Cox (2010)
      NTRS 20110942664, slide 4, whose labels (read from the figure) are 20.3 cm x 13.4 cm x 19.25 cm plus a
      5.2 cm removable ERC base - agreement within 1 mm. Neither source says whether these are internal or
      external dimensions. CONFLICT: the same slide deck's comparison table (slide 5) lists ABRS 'Growing Area
      16.0 (W) x 21.1 (D) cm', 'Growing Area Height 27.0 cm', 'Total Growing Volume 675 cm3'; that table is
      internally inconsistent (16 x 21.1 x 27 = 9115 cm3) and is not used.
  free_air_volume_L:
    value: 5.16
    unit: L
    source: "SPLASH instrument #64 (ABRS), specimen_size field"
    url: https://visualization.osdr.nasa.gov/splash-api/public/instruments/64
    quote: "20.2L 13.3W 19.2H cm growth chamber"
    kind: derived
    note: "0.202 x 0.133 x 0.192 m = 5.16 L gross ERC volume; the GFP Imaging System (GIS) insert and six plates occupy part of it (their volumes are not sourced)."
  specimen_container:
    value: "100 mm square Petri plate with phytagel medium, held in the GFP Imaging System (GIS) insert"
    unit: '-'
    source: "Paul A.-L., Amalfitano C.E., Ferl R.J. (2012) Plant growth strategies are remodeled by spaceflight. BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "The GIS holds six standard 100 mm square Petri plates (Fisher Scientific) in two tiers."
    kind: specified
    note: "APEX-01/TAGES and APEX-03 (OSD-16; registry payload APEX-03-2 description). Paul et al. 2013 call them '10 cm2 solid media plates'."
  specimen_container_mm:
    value: [100, 100]
    unit: mm
    source: "Paul, Amalfitano, Ferl (2012) BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "The foundational growth medium for Arabidopsis plants on orbit was phytagel in standard 100mm square Petri plates."
    kind: specified
    note: "Nominal side lengths; plate depth and medium thickness not stated."
  n_specimen_units:
    value: 6
    unit: plates per GIS (one ERC)
    source: "Paul, Amalfitano, Ferl (2012) BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "The GIS holds six standard 100 mm square Petri plates (Fisher Scientific) in two tiers."
    kind: specified
    note: "Two ERCs per ABRS, the GIS occupying one: 'ABRS is composed of two independently programmable Environmental Research Chambers (ERCs), one of which housed the Experiment Unique Equipment referred to as the Green Fluorescent Protein Imaging System' (same source). 12 to 18 seeds per plate (Paul et al. 2013)."
  layout:
    value: "GIS: two tiers of three plates; lower tier positions 1, 3, 5 (plate 1 faces the camera); upper tier 2, 4, 6; LED panel in the chamber top directly above"
    unit: '-'
    source: "Paul A.-L., Zupanska A.K., Schultz E.R., Ferl R.J. (2013) Organ-specific remodeling of the Arabidopsis transcriptome in response to spaceflight. BMC Plant Biol. 13:112"
    url: https://doi.org/10.1186/1471-2229-13-112
    quote: "Each slot is assigned a number (shown in red) to identify plate position: positions 1, 3, and 5 are on the bottom tier, and positions 2, 4, and 6 are in the top tier."
    kind: specified
    note: "Paul et al. 2012: the imaging plate level is 12 cm below the top of the upper-tier plates."

specimen:
  types:
    value: ["Arabidopsis thaliana seedlings (GFP reporter lines; WS, Col-0)"]
    unit: '-'
    source: "Paul, Zupanska, Schultz, Ferl (2013) BMC Plant Biol. 13:112"
    url: https://doi.org/10.1186/1471-2229-13-112
    quote: "The work reported here is a biologically replicated molecular analysis of 12-day-old Arabidopsis plants grown on phytagel plates within the Advanced Biological Research System (ABRS)."
    kind: specified
    note: "ABRS also flew white spruce and willow (APEX-Cambium; Cox 2010 NTRS 20110942664) - different specimen geometry, not covered here."

ventilation:
  mode:
    value: forced
    unit: '-'
    source: "Paul, Zupanska, Schultz, Ferl (2013) BMC Plant Biol. 13:112 (same text in OSD-16 protocol)"
    url: https://doi.org/10.1186/1471-2229-13-112
    quote: "The ABRS provided temperature control, light control, and circulation of air that was scrubbed to remove volatile organic compounds (VOCs)."
    kind: specified
    note: "Closed chamber with recirculation and scrubbing (ethylene/VOC); Cox 2010 lists 'ethylene scrubbing and water recycling'. Recirculation vs make-up air fraction not stated."
  flow_rate_L_min:
    value: null
    unit: L/min
    note: "Not found."
  air_velocity_m_s:
    value: null
    unit: m/s
    note: "Not found."
  inlet:
    value: "air enters the GIS from the plate-3 side"
    unit: '-'
    source: "Paul, Amalfitano, Ferl (2012) BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "Air is circulated by entering into the GIS from the plate-3-side of the unit and exits under the plate 5 position"
    kind: specified
    note: "A deflector inside the GIS redirects slightly cooler air to the back of plate 1 to keep its face free of condensation (same source)."
  outlet:
    value: "air exits under the plate-5 position"
    unit: '-'
    source: "Paul, Amalfitano, Ferl (2012) BMC Plant Biol. 12:232"
    url: https://doi.org/10.1186/1471-2229-12-232
    quote: "Air is circulated by entering into the GIS from the plate-3-side of the unit and exits under the plate 5 position"
    kind: specified

