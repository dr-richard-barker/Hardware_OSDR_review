specimen:
  types:
    value: daylily somatic embryo cultures (Mir, 4.5 months, 5% CO2); planarian flatworms in 50 mL tubes (29 days)
    unit: '-'
    source: Richards SE, Levine HG, Romero V (2016) Biological Research in Canisters (BRIC)-100VC. NASA KSC fact
      sheet SP-2015-07-291-KSC; NTRS 20160005064
    url: https://ntrs.nasa.gov/api/citations/20160005064/downloads/20160005064.pdf
    quote: has supported Dugesia japonica (flatworm) within spring under normal atmospheric conditions for 29 days
      in space and Hemerocallis lilioasphodelus L. (daylily) somatic embryo development within a 5% CO2 gaseous
      environment for 4.5 months in space.
    kind: specified
