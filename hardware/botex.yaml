  specimen_container:
    value: "CRIC containers (CRIC 1-4) holding minicages / Petriperm dishes; drawn from upper and lower drawers"
    unit: "-"
    source: "NASA OSDR hardware registry, record 906 (BOTEX), components; same text in Neurolab Final Report sec 3.2.2"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/906
    quote: "The cylindrical CRIC 3 containers (80 mm high x 100 mm diameter) are located in the lower drawer of the BOTEX in front of the centrifuge during orbit."
    kind: specified
    note: "Registry container geometry is given in the next fields. Note the registry's 'wide x high x diameter' notation for CRIC 1/2 is ambiguous (a 3rd dimension labelled 'diameter' on a box)."
  specimen_container_mm:
    value:
      CRIC1_wide_high_diameter: [325, 60, 160]
      CRIC2_wide_high_diameter: [330, 60, 130]
      CRIC3_high_diameter: [80, 100]
      CRIC4_high_diameter: [125, 330]
    unit: mm
    source: "NASA OSDR hardware registry, record 906, components 'CRIC 1/2/3/4 Container'"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/906
    quote: "The CRIC 1 containers (325 mm wide x 60 mm high x 160 mm diameter) serve as holding assemblies for 40 minicages and are located in the upper drawer of the BOTEX during orbit."
    kind: specified
    note: >-
      Other quotes (same record): "The CRIC 2 container  (330 mm wide x 60 mm high x 130 mm diameter) has 4 separate
      compartments, each with a wire mesh top and a circular door in the front."; "The cylindrical CRIC 4 container
      (125 mm high x 330 mm diameter) can hold up to 60 minicages for centrifugation."
  petriperm_dish_volume_mL:
    value: 25
    unit: mL
    source: "Horn E, Pfalzer S, Riewe P, Sebastian C, Kamper G, Friedrich U, Junk P (1997) A modified BOTEX incubator as a transport system for developing crickets into space. Poster abstract, 12th Man in Space Symposium: The Future of Humans in Space, Abstract Volume; NTRS 19980024373"
    url: https://ntrs.nasa.gov/citations/19980024373
    quote: "can be reared in tightly closed Petriperm dishes with an internal volume of 25 ml for at least 20 days."
    kind: specified
    note: "Ground EVT result for the CRISP configuration; Petriperm material permeability not stated."
  n_specimen_units:
    value: "80 Petriperm dishes for 0g/hg samples; in flight 30 (1g control), 20 (0.7g), 10 (0.3g); plus 8 containers of 415-625 ml"
    unit: "-"
    source: "Horn et al. (1997) poster abstract, NTRS 19980024373"
    url: https://ntrs.nasa.gov/citations/19980024373
    quote: "The modified BOTEX incubator allows the transport of 80 Petriperm dishes used for the lag- or hg- samples. Under space conditions, 30 dishes for the inflight lg-control, 20 for a 0.7g- and 10 for a 0.3g-condition are also available."
    kind: specified
    note: "'lag'/'lg'/'hg' are OCR/typesetting artefacts in the NTRS text for '0g'/'1g'/'hypergravity' (interpretation). The Neurolab flight itself used a 1-G reference centrifuge and a 3-G ground hypergravity control (registry OS-538)."
  layout:
    value: "Upper drawer (CRIC 1, CRIC 2), lower drawer (CRIC 3 stack in front of centrifuge; CRIC 4 = centrifuge rotor)"
    unit: "-"
    source: "NASA OSDR hardware registry, record 906, component 'BOTEX Incubator Centrifuge'"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/906
    quote: "The centrifuge is a 1-G reference centrifuge located in the lower drawer of the BOTEX.  The speed range is from 60 to 90 rpm with nominal operation at 90 rpm. A CRIC 4 container serves as the centrifuge rotor."
    kind: specified

