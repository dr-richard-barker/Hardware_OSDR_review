location:
  value: "Spacelab module (Neurolab, STS-90, 1998); previously flown on Spacelab D-2 (1993)"
  unit: "-"
  source: "Maese AC, Ostrach LH, Dalton BP et al. (2002) Neurolab: Final Report for the Ames Research Center Payload. NASA, NTRS 20020073543, section 3.2.2"
  url: https://ntrs.nasa.gov/citations/20020073543
  quote: "One BOTEX Incubator was flown on Neurolab in the Spacelab."
  kind: specified
  note: >-
    Quotes from this report are from OCR of the scanned PDF (tesseract, this session). Same report sec 1.3:
    "the BOTEX (previously flown on the German Spacelab mission D-2, in 1993)". Launch/landing: experiment
    equipment "stowed in a large middeck locker tray".

