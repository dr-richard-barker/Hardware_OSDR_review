    note: >-
      Incubator air handling not documented. Container-level: CRIC 3 stacks are "separated by a spacer ring to allow
      for air exchange" and CRIC 2 compartments have "a wire mesh top" (registry 906) - i.e. containers exchange
      with the incubator air, but whether that air is fan-circulated is unknown. Horn et al. 1997 describe "the
      closed BOTEX incubator" and "tightly closed Petriperm dishes".
