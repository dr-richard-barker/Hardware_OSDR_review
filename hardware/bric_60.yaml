specimen:
  types:
    value: tomato, Arabidopsis, soybean seedlings; Physarum cells; gypsy moth eggs; Ceratodon moss
    unit: '-'
    source: Richards SE, Levine HG, Romero V (2016) Biological Research in Canisters (BRIC)-60. NASA KSC fact sheet
      SP-2015-07-289-KSC; NTRS 20160005063
    url: https://ntrs.nasa.gov/api/citations/20160005063/downloads/20160005063.pdf
    quote: Specimens flown in the BRIC 60 mm petri dish (BRIC-60) hardware include Lycoperscion esculentum (tomato),
      Arabidopsis thaliana (thale cress), Glycine max (soybean) seedlings, Physarum polycephalum (slime mold) cells,
      Pothetria dispar (gypsy moth) eggs and Ceratodon purpureus (moss).
    kind: specified
ventilation:
  mode:
    value: passive (4 light-tight labyrinth pressure-relief vents per chamber lid)
    unit: '-'
    source: Richards SE, Levine HG, Romero V (2016) Biological Research in Canisters (BRIC)-60. NASA KSC fact sheet
      SP-2015-07-289-KSC; NTRS 20160005063
    url: https://ntrs.nasa.gov/api/citations/20160005063/downloads/20160005063.pdf
    quote: Four pressure relief vents in each chamber lid adhere to the rapid depressurization requirements for
      space flight. These specialized vents make a series of unique convoluted turns maintaining a light-tight environment
      inside the canister chamber.
    kind: specified
    note: 'ESA-ISLSWG 2003 workshop report: "BRIC-60 (vented) accommodates 60 mm Petri dishes". The vents are specified
      for depressurization; their gas-exchange conductance is not quantified anywhere found, so "passive" here means
      vented, not a measured exchange rate. The BRIC-60M variant is described as a "sealed canister" with 2 gas-sampling
      ports.'
