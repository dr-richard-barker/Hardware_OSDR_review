entity_id: HW068
name: Animal Enclosure Module (AEM, Space Shuttle middeck)
splash_ids: [68]
registry_ids: ["133"]

location:
  value: "Space Shuttle middeck stowage locker (modified locker door)"
  unit: "-"
  source: "OSDR Hardware Registry 133, Animal Enclosure Module (AEM) (snapshot 2026-10-12)"
  url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
  quote: "The unit fits inside a standard Shuttle middeck locker with a modified locker door."
  kind: specified
  note: "Unit stays in the locker for launch/landing; on orbit it can be pulled partway out for viewing. Also verified to fit in the Spacelab General Purpose Work Station (NASA TM-89289)."

geometry:
  enclosure_internal_mm:
    value: [363.22, 219.71, 242.57]
    unit: mm
    source: "Riskowski G.L., Gonyou H.W., Harrison P.C., Kelley K.W., Tumbleson M.E. (1993) Effect of double density caging during Space Shuttle transport of laboratory rats. Final report to NASA (Contractor Report), NTRS 19940006708, Fig. 2b"
    url: https://ntrs.nasa.gov/citations/19940006708
    quote: "The cage had the same dimensions as the cage in the actual AEMs."
    kind: specified
    note: >-
      Values (length x depth x height, mm) read from Fig. 2b 'MAEM Cage Dimensions (all units are mm)': 363.22 long, 219.71
      deep (side view), 242.57 high; the central water storage box is 120.65 wide x 165.10 high x 187.41 deep with 4 lixits
      underneath. Independently, Orr et al. (NTRS 20190004914) give for the AEM 'a habitable area enclosed with stainless steel
      mesh screens measuring approximately 24 X 36 X 22 cm' - consistent. External envelope: 24.50 x 43.69 x 51.05 cm
      (NASA TM-89289; same in SPLASH 68). Total animal floor space '125 in2' in TM-89289 (early unit); the mock AEM floor was
      '620 cm2' (Riskowski 1993).
  free_air_volume_L:
    value: 15.6
    unit: L
    source: "Derived from Riskowski et al. (1993) NTRS 19940006708 Fig. 2b"
    url: https://ntrs.nasa.gov/citations/19940006708
    quote: "The MAEMs had the same interior dimensions and materials as the AEMs. This included the space occupied by the water storage tank and waterers in the center of the AEMs."
    kind: derived
    note: "363.22 x 219.71 x 242.57 mm = 19.36 L cage minus water box 120.65 x 165.10 x 187.41 mm = 3.73 L -> 15.6 L. Does not subtract food bars, lixits, divider, animals, or the inlet/exhaust filter plenums outside the cage."
  specimen_container:
    value: "stainless-steel grid cage with central water box; optional removable divider"
    unit: "-"
    source: "NASA TM-89289 (1987) Life Sciences Laboratory Equipment Catalog, p. 3, NTRS 19870012958"
    url: https://ntrs.nasa.gov/citations/19870012958
    quote: "The AEM is composed of a stainless steel grid cage module, fan blowers, a layered filter system, interior lamps, and a water unit; food bars are glued on cage walls."
    kind: specified
  specimen_container_mm:
    value: null
    unit: mm
    note: "Cage = enclosure (above). Half-cage compartment dimensions with divider not given."
  n_specimen_units:
    value: "up to 10 mice (5 per compartment) or 6 rats (3 per compartment)"
    unit: animals
    source: "Beheshti A. et al. (2018) Global transcriptomic analysis suggests carbon dioxide as an environmental stressor in spaceflight. Sci Rep 8:4191. doi:10.1038/s41598-018-22613-1"
    url: https://doi.org/10.1038/s41598-018-22613-1
    quote: "AEM can either contain up to 10 mice in two compartments (5 mice per compartment) or 6 rats maximum (3 rats per compartment)."
    kind: specified
    note: "Registry 133: 'up to six 250 g rats'; NASA TM-89289: 'up to six 350-g rats'; SPLASH 68: '6 rats up to 250g, 20 mice'; Choi et al. 2020 Table 1: 'up to 10 mice or 5 rats'. Moyer et al. 2016 housed 5 rats (no divider) in the ground AEM. Full text read via Europe PMC (PMC5843582)."
  layout:
    value: "single cage, optional divider plate -> 2 holding areas; water box in cage centre; food-bar plates on walls"
    unit: "-"
    source: "OSDR Hardware Registry 133"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
    quote: "A removable divider plate provides two separate animal holding areas, if required."
    kind: specified
    note: "Variants: NIH.R3 Nursing Facility insert (two den/nest suites), Neurolab access hatches, CBTM-3 mesh divider (registry 133 version notes)."

ventilation:
  mode:
    value: forced
    unit: "-"
    source: "OSDR Hardware Registry 133, Air Quality subsystem"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
    quote: "Four fans create a slight negative pressure inside the AEM ensuring an inward flow of air and particulate entrapment by the treated outlet filter."
    kind: specified
    note: "Once-through exchange with cabin air; filters rated for 20 days of odor control. Moyer et al. 2016 (npj Microgravity 2:16002) measured exhaust-filter pressure drop 0.33-0.35 in H2O (mice) and 0.32-0.34 in H2O (rats) in ground AEMs."
  flow_rate_L_min:
    value: null
    unit: L/min
    note: >-
      Not found. The 1993 mock AEM (Riskowski et al., NTRS 19940006708) was 'constructed to provide a uniform distribution of
      airflow (0.13 m/s; 25 fpm velocity) approaching the rat cages', a value 'chosen' by the investigators for waste removal -
      it is a property of the mock, not a measured AEM flow, so it is not recorded as an AEM value.
  air_velocity_m_s:
    value: null
    unit: m/s
    note: "See flow_rate_L_min (mock-AEM design velocity 0.13 m/s, top-to-bottom, not adopted)."
  inlet:
    value: "front-panel inlet slots -> side plenum walls -> inlet filter at rear of AEM -> across cage"
    unit: "-"
    source: "OSDR Hardware Registry 133, Air Quality subsystem"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
    quote: "Cabinet air is drawn through front panel inlet slots, then along the side plenum walls to the rear of the AEM, and then through the inlet filter, across the cage/animal habitat area"
    kind: specified
    note: "Lamps sit 'in the rear corners of the AEM, between the animal habitat and inlet filter' (registry Lighting component)."
  outlet:
    value: "exhaust filter at front between cage and fans -> 4 fans -> cabin via air deflector"
    unit: "-"
    source: "OSDR Hardware Registry 133, Air Filter System component"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
    quote: "After exiting the habitat through the exhaust filter, located at the front of the unit between the rodent cage and fans, the filtered air is drawn through the fans into the cabin and directed by the air deflector."
    kind: specified

environment:
  temperature_C:
    value: 28
    unit: degC
    source: "NASA OSDR dataset OSD-310 (PSE.04, STS-62, rats), study protocol description"
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-310/
    quote: "The AEMs were maintained at 28 °C."
    kind: measured
    note: >-
      Mission-specific. OSD-87 (STS-135, mice): 'the temperature was set at 3 to 8C above the environmental middeck temperature'.
      NASA TM-89289: temperature = 'Orbiter middeck or Spacelab cabin (four internal fans circulate air through the AEM from the cabin)'.
      Liu et al. 2009 (Basic Appl Myol 19:87) comparison table lists AEM air temperature '30 °C passive'. Flight AEM temperature
      logs exist in OSDR/ALSDA payload files (e.g. MI2/STS-133, NIH.R3, PSE.03) but were not analysed here.
  rh_percent:
    value: [40, 60]
    unit: "%"
    source: "Liu Y., Biticchi R., Cilli M., Piccardi F., Ruggiu A., Cancedda R. (2009) Mouse Drawer System (MDS): an automated payload for supporting rodent research on the ISS. Basic Applied Myology 19(2&3):87-95, comparison table"
    url: "https://www.bio.unipd.it/~bam/PDF/19-2&3/Cancedda.pdf"
    quote: "Relative humidity 50±10%"
    kind: specified
    note: "AEM column of a cross-facility comparison table (citing its refs [2,5]); not a measured flight value. AEM has no active humidity control."
  co2_ppm:
    value: 3000
    unit: ppm
    source: "Beheshti A. et al. (2018) Sci Rep 8:4191. doi:10.1038/s41598-018-22613-1"
    url: https://doi.org/10.1038/s41598-018-22613-1
    quote: "In general, CO2 concentration on ground and therefore, in vivarium cages is approximately 300 ppm, while on the space shuttle and in matched ground AEM it reaches up to 3000 ppm5."
    kind: measured
    note: "Upper value ('up to'). Bion-M1-matched AEM controls averaged 682 ppm. Moyer et al. 2016 ground AEM 35-day tests: CO2 <0.1 % (mice) and <0.07 % (rats); acceptance limit 0.7 %."
  o2_percent:
    value: null
    unit: "%"
    note: "Cabin air; not reported."
  pressure_kPa:
    value: null
    unit: kPa
    note: "Shuttle middeck cabin; no value in sources opened."
  light:
    value: "4 incandescent lamps (2 used), average 14 lux, 12:12 h timer"
    unit: lux
    source: "OSDR Hardware Registry 133, Lighting component"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
    quote: "The four internal lamps provide an average of 14 lux illumination and are controlled by an automatic timer to provide a 12-hour lighting cycle."
    kind: specified
    note: "Only two lamps are used during the light cycle to limit heating (registry 133). OSD-87 confirms 14 lux 12:12 on STS-135. Lamps are a heat source inside the cage plenum."

nutrients:
  mode:
    value: food_bar+lixit
    unit: "-"
    source: "OSDR Hardware Registry 133, Water Refill Box"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
    quote: "The AEM accommodates an internal water supply containing four lixit drinking valves and two flexible plastic bladders for water storage."
    kind: specified
    note: "Early student-program units (SSIP) used potatoes for water. Water capacity: TM-89289 '1500- and 2000-cc'; registry 133 Water component says '1500- and 200-cc' (probable typo); CBTM-3 used a 2.0 L water box."
  detail:
    value: "NuRFB food bars on slide-in plates; planning ration 4.0 g food + 4.5 mL water per mouse/day, 40 g + 50 mL per rat/day"
    unit: "-"
    source: "Moyer E.L. et al. (2016) Evaluation of rodent spaceflight in the NASA animal enclosure module for an extended operational period (up to 35 days). npj Microgravity 2:16002. doi:10.1038/npjmgrav.2016.2"
    url: https://doi.org/10.1038/npjmgrav.2016.2
    quote: "the average daily NuRFB and water consumption requirement are 4.0 g and 4.5 ml, respectively, per mouse per day, and 40 g and 50 ml per rat per day."
    kind: specified
    note: "Measured in ground AEMs: 3.69 g NuRFB and 4.2 mL water per mouse per day. Type 12 NuRFB bar 20.32 x 2.54 x 3.05 cm (Moyer 2016); registry 133 food bars 'approx. 1.875 x 1 x 8 inches'. Full text via Europe PMC (PMC5515519)."

specimen_load:
  o2_flux:
    value: 1.44
    unit: "mL O2 h-1 per g body mass (rat, worst-case design)"
    source: "Niederwieser T. et al. (2014) AEM-E - A small life support system for the transport of rodents to the ISS. ICES-2014-101"
    url: http://hdl.handle.net/2346/59702
    quote: "Rats: O2 = 1.44 mL/(hr g), CO2 = 1.34 mL/(hr g), H2O = 20.0 mL/(day each), RQ = 0.92"
    kind: specified
    note: "Worst-case peak design rates drawn by the authors from published rodent data; averages 'can often be less than 50%'. For a 300 g rat 432 mL O2/h (derived). Mouse values: see rodent_habitat.yaml (C57BL/6 measured 3.63 mL O2/(h g))."
  co2_flux:
    value: 1.34
    unit: "mL CO2 h-1 per g body mass (rat, worst-case design)"
    source: "Niederwieser T. et al. (2014) ICES-2014-101"
    url: http://hdl.handle.net/2346/59702
    quote: "Rats: O2 = 1.44 mL/(hr g), CO2 = 1.34 mL/(hr g), H2O = 20.0 mL/(day each), RQ = 0.92"
    kind: specified
    note: "For a 300 g rat 402 mL CO2/h (derived)."
  h2o_flux:
    value: 20.0
    unit: "mL metabolic water per rat per day (design)"
    source: "Niederwieser T. et al. (2014) ICES-2014-101"
    url: http://hdl.handle.net/2346/59702
    quote: "Rats: O2 = 1.44 mL/(hr g), CO2 = 1.34 mL/(hr g), H2O = 20.0 mL/(day each), RQ = 0.92"
    kind: specified
    note: "This is metabolically produced water (Table 3 of the paper), not total evaporation. Riskowski et al. 1993 state that for rats 'under normal conditions, sensible heat production is twice the latent heat production'."
  heat_W:
    value: 3.16
    unit: "W per rat (sensible/convective, measured in a mock AEM)"
    source: "Riskowski G.L. et al. (1993) Effect of double density caging during Space Shuttle transport of laboratory rats. NTRS 19940006708 (Maghirang & Riskowski section)"
    url: https://ntrs.nasa.gov/citations/19940006708
    quote: "Convective heat losses for MAEM-SD and MAEM-DD varied from 2.87 to 3.86 W/rat and from 2.05 to 2.87 W/rat, respectively; overall mean convective heat losses were 3.16 and 2.41 W/rat."
    kind: measured
    note: "Male Sprague-Dawley rats (~286 g), 4 per mock AEM (SD), room 22 C. 2.41 W/rat at double density (8 rats, huddling). Sensible only; ASHRAE estimate quoted in the same report: 2.38 W sensible for a 300 g rat. Mouse heat: 15.7 W/kg (rodent_habitat.yaml)."

walls:
  material:
    value: "stainless-steel grid cage; clear Lexan cover on top; HEPA-type electrostatic/phosphoric-acid fiberglass filters with treated charcoal"
    unit: "-"
    source: "OSDR Hardware Registry 133"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/133
    quote: "On orbit the AEM may be removed partway from the locker and the interior viewed or photographed through a Lexan cover on the top of the unit."
    kind: specified
    note: "Grid material: NASA TM-89289 ('stainless steel grid cage module')."
  gas_permeability:
    value: null
    unit: "-"
    note: "Grid walls are open; not applicable/not found."

thermal:
  power_W:
    value: [35.5, 46.5]
    unit: W
    source: "NASA TM-89289 (1987) Life Sciences Laboratory Equipment Catalog, p. 3, NTRS 19870012958"
    url: https://ntrs.nasa.gov/citations/19870012958
    quote: "35.5 W (min), 46.5 W (max)"
    kind: specified
    note: "SPLASH 68 gives 35.4 W and 28 V power. Loaded mass 26.8 kg (TM-89289) vs 27.2 kg (SPLASH 68)."

searched: |
  OSDR registry 133 (all components/versions); SPLASH 68 (not in scrambled range); NASA TM-89289 LSLE catalog
  (NTRS 19870012958, page images checked); NASA CR NTRS 19940006708 (mock AEM drawings and heat loss);
  Moyer et al. 2016 npj Microgravity (PMC5515519); Beheshti et al. 2018 Sci Rep (PMC5843582); Orr et al. NTRS 20190004914;
  OSDR protocol text (OSD-21, 25, 87, 108, 116, 310, 351, 397, 977); web search for AEM fan cfm / air velocity (none found);
  ISS National Lab AEM page and govdocs mirror of a NASA facility overview (both unreachable: HTTP 403/404, DNS failure).
  Missing: real AEM fan flow rate / cage air velocity, inlet slot and filter areas, in-flight RH.
