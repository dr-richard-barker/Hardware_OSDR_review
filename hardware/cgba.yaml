environment:
  temperature_C:
    value: [-16, 37]
    unit: degC
    source: BioServe Space Technologies, CGBA spaceflight-hardware page (accessed 2026-10-12)
    url: https://www.colorado.edu/center/bioserve/spaceflight-hardware/cgba
    quote: The Commercial Generic Bioprocessing Apparatus (CGBA) is a dual-function incubator/freezer capable of
      operation between -16 °C and 37 °C depending on configuration.
    kind: specified
    note: 'Refrigerator mode 4-37 °C, freezer mode -16-37 °C (BioServe; SPLASH #44 agrees). CONFLICT: registry 908
      ISS configuration says freezer unit "16°C to 40°C" and refrigeration unit "4°C to 40°C" (upper limit 40 vs
      37; missing minus sign likely). Flight examples: 22 ± 1 °C (C. elegans, Oczypok 2012), 25 °C (spiders, Zschokke
      2020), 37 °C (Kim 2013; OSD-50/118), water loop 20.0 ± 2 °C (STS-106).'
