    note: >-
      Facility/cassette air handling not documented. Gas exchange to specimens in UMAMI was by diffusion through
      FEP bag walls ("permeable to O2 and CO2 but impermeable to water", OSD-961); the gas environment of the
      cassette around the bags is not described. SPLASH gas_control field reads "CO2" with no detail.
