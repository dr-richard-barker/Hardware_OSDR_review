entity_id: HW046
name: ADvanced Space Experiment Processor (ADSEP)
vendor: Space Hardware Optimization Technology (SHOT) -> Techshot Inc. -> Redwire Space
splash_ids: [46]
registry_ids: []
curated: "2026-10-12"

location:
  value: "Single middeck-locker-equivalent facility; Shuttle middeck (1996-2003 era) and ISS / Dragon (ADSEP2, 2021 UMAMI ran in Cargo Dragon)"
  unit: "-"
  source: "Redwire/Techshot press release 'Squid launching aboard next SpaceX Cargo Dragon in new Techshot device' (28 May 2021)"
  url: https://rdw.com/newsroom/squid-launching-aboard-next-spacex-cargo-dragon-in-new-techshot-device
  quote: "In a first for Techshot, the in-space portion of the research will be completed autonomously by ADSEP2 aboard the uncrewed SpaceX Cargo Dragon capsule, rather than inside the ISS."
  kind: specified
  note: >-
    Astrobiology.com (2024, Redwire image caption): "fully automated, multi-use single middeck locker processing
    facility". VERSION CAVEAT: OSDR's single entity covers first-generation ADSEP (SHOT, Shuttle), ADSEP2
    and ADSEP-4; specs below are tagged by version where the source allows.

geometry:
  enclosure_external_in:
    value: [18, 11, 21]
    unit: in
    source: "SpaceNews (28 Oct 2002) 'This space for rent - SHOT seeks additional customers for space shuttle mission'"
    url: https://spacenews.com/this-space-for-rent-shot-seeks-additional-customers-for-space-shuttle-mission/
    quote: "The facility, into which up to three cassettes at a time may be inserted, is the size of a single shuttle middeck locker (approximately 18″ x 11″x 21″)."
    kind: specified
    note: "Approximate EXTERNAL envelope of the first-generation (Shuttle-era) ADSEP = ~457 x 279 x 533 mm (unit conversion). Redwire describes ADSEP2 as 'microwave oven size'. Internal dimensions not found."
  enclosure_internal_mm:
    value: null
    unit: mm
    note: "Not found."
  specimen_container:
    value: "Experiment cassette ('lunchbox size'); UMAMI Fluid Processing Cassette with 8 loops x 3 FEP 25-mL culture bags"
    unit: "-"
    source: "OSDR OSD-961 study protocol (UMAMI, SpaceX-22)"
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-961/
    quote: "Each cassette housed eight experimental loops, consisting of three fluorinated ethylene propylene (FEP) 25-mL cell culture bags (Saint-Gobain, Gaithersburg, MD), which are permeable to O2 and CO2 but impermeable to water."
    kind: specified
    note: "Bags connected by 1/16 in ID platinum-cured silicone tubing with a peristaltic pump at each end (same protocol). Redwire 2021: 'The squid are housed inside bags in two lunchbox size cassettes'."
  cassette_volume_L:
    value: 3
    unit: L
    source: "NASA OSDR SPLASH instrument catalogue, record _id 46, 'specimen_types_supported' field"
    url: https://visualization.osdr.nasa.gov/splash-api/public/instruments/46
    quote: "Empty cassette volume is approximately three liters."
    kind: specified
    note: "SPLASH specimen_size: 'within 3L cassette'. Not confirmed in a Redwire engineering document."
  specimen_container_mm:
    value: null
    unit: mm
    note: "Cassette and bag dimensions not found."
  n_specimen_units:
    value: 3
    unit: cassettes
    source: "Astrobiology.com (25 Jun 2024) caption of Redwire image sc2024e043200"
    url: https://astrobiology.com/2024/07/offworld-life-science-hardware-space-advanced-space-experiment-processor.html
    quote: "The ADSEP facility contains three independent thermal zones, each accommodates one “mini-laboratory” cassette and an internal computer that controls the processing of all three cassettes."
    kind: specified
    note: "CONFLICT: ISS National Lab facility page says experiments run 'simultaneously in up to four cassettes' (possibly ADSEP-4). SPLASH and SpaceNews 2002 agree on three."
  layout:
    value: "3 independent thermal zones, 1 cassette each"
    unit: "-"
    source: "NASA OSDR SPLASH instrument catalogue, record _id 46, 'background' field"
    url: https://visualization.osdr.nasa.gov/splash-api/public/instruments/46
    quote: "The ADSEP facility contains three independent thermal zones, each accommodating one cassette, and an internal computer that controls the processing of all three cassettes."
    kind: specified

