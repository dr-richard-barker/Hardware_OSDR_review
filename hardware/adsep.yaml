    unit: "-"
    source: "OSDR OSD-961 study protocol"
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-961/
    quote: "After colonization, approximately 24 mL of FSW was pumped out of the Aquarium bag back into the Inoculation bags, which were then renamed the Waste bags after which 24 mL of RNALater was added to the Aquarium bags"
    kind: specified
    note: "Pump flow rate not given."

