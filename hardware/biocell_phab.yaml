ventilation:
  mode:
    value: sealed (CO2-charged for transport) or passive (vented; vent cover removed inside incubator)
    unit: '-'
    source: Wnorowski A, Sharma A, Chen H, et al. (2019) Effects of Spaceflight on Human Induced Pluripotent Stem
      Cell-Derived Cardiomyocyte Structure and Function. Stem Cell Reports 13:960. doi:10.1016/j.stemcr.2019.10.006
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6915842/fullTextXML
    quote: The Plate Habitat (PHAB) is an aluminum box that can be sealed or vented.
    kind: specified
    note: 'BioServe PHAB page: configurable vents/seals allow "either active gas exchange with the environment for
      example when placed in a 5% CO2 environment such as in SABL or sealed to provide a passive (non-powered) 5%
      CO2 environment during launch". Registry 2005: "a sealed container that allows for gas exchange". No fan in
      the PHAB; incubator air circulation not sourced.'
  flow_rate_L_min:
    value: null
    unit: L/min
    note: Not applicable at PHAB level (no forced flow sourced).
  inlet:
    value: removable vent cover (aluminum + Kapton tape) over PHAB vents
    unit: '-'
    source: Wnorowski A, Sharma A, Chen H, et al. (2019) Effects of Spaceflight on Human Induced Pluripotent Stem
      Cell-Derived Cardiomyocyte Structure and Function. Stem Cell Reports 13:960. doi:10.1016/j.stemcr.2019.10.006
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6915842/fullTextXML
    quote: Vents are then sealed with a cover made of aluminum and Kapton tape.
    kind: specified
    note: Vent size/number not sourced.
  outlet:
    value: null
    note: Not sourced.
environment:
  temperature_C:
    value: 37
    unit: degC
    source: Wnorowski A, Sharma A, Chen H, et al. (2019) Effects of Spaceflight on Human Induced Pluripotent Stem
      Cell-Derived Cardiomyocyte Structure and Function. Stem Cell Reports 13:960. doi:10.1016/j.stemcr.2019.10.006
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6915842/fullTextXML
    quote: On board the ISS, the vent cover is removed and the PHAB is placed in an on-board incubator (SABL) that
      provides 37°C and active 5% CO 2 control.
    kind: specified
    note: 'Mammalian-cell set point (incubator, not PHAB-internal measurement). Measured inside PHABs for fungal
      biofilms (Hupka 2023): "25.6 ± 0.9 °C" (flight). OSD-118: CGBA preset 37 °C. SPLASH #19 temperature_range
      "-80C to +43C" (hardware compatibility).'
  rh_percent:
    value: 96.6
    unit: '%'
    source: Hupka M, Kedia R, Schauer R, et al. (2023) Morphology of Penicillium rubens Biofilms Formed in Space.
      Life 13:1001. doi:10.3390/life13041001
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10144393/fullTextXML
    quote: The RH during incubation was 96.6 ± 6.0% for all spaceflight samples, while for Earth PHABs, the humidity
      was less stable for some cases.
    kind: measured
    note: Fungal-biofilm configuration with absorbent mats wetted with 9 mL water per PHAB; not a general PHAB property.
  co2_ppm:
    value: [45000, 50000]
    unit: ppm
    source: Wnorowski A, Sharma A, Chen H, et al. (2019) Effects of Spaceflight on Human Induced Pluripotent Stem
      Cell-Derived Cardiomyocyte Structure and Function. Stem Cell Reports 13:960. doi:10.1016/j.stemcr.2019.10.006
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6915842/fullTextXML
    quote: The PHAB, in this configuration, can maintain 4.5%–5% CO 2 for up to 9 days once charged and sealed.
    kind: derived
    note: 4.5-5% (v/v) converted to ppm; sealed transport configuration. In SABL/ACM the CO2 is actively held at
      5%.
  o2_percent:
    value: null
    unit: '%'
    note: Not sourced (ISS cabin air when vented).
  pressure_kPa:
    value: null
    unit: kPa
    note: Not sourced.
  light:
    value: dark (fungal-biofilm run); otherwise not specified
    unit: '-'
    source: Hupka M, Kedia R, Schauer R, et al. (2023) Morphology of Penicillium rubens Biofilms Formed in Space.
      Life 13:1001. doi:10.3390/life13041001
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10144393/fullTextXML
    quote: and darkness, rendering the ideal environment for fungal growth.
    kind: specified
