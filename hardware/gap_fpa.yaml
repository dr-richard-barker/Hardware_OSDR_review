    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-20/
    quote: Cultures were grown in spaceflight conditions or synchronous ground control conditions for 25 hours at
      ambient temperature (23C).
    kind: measured
    note: 'Experiment-specific; the GAP itself has no thermal control in the hand-crank version. Other flights:
      37 °C in CGBA (Kim 2013, OSD-50 BONEMAC), 30 °C activation (Micro-6 payload), 37 °C in SABL (OSD-554/627).
      SPLASH #27 operational_temperature "-120C to +60C" is a survival range.'
