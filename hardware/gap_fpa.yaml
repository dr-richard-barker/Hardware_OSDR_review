specimen:
  types:
    value: microorganisms, mammalian cells, viruses/bacteria, protein crystals, biomaterials, small plants/seeds
    unit: '-'
    source: 'SPLASH instrument #27 (Group Activation Pack-Fluid Processing Apparatus ; Group Activation Pack), snapshot
      2026-10-12'
    url: https://visualization.osdr.nasa.gov/splash-api/public/instruments/27
    quote: microorganisms, mammalian cells and tissues, viruses and bacteria, protein crystal growth, biomaterials,
      small plants/seed germination
    kind: specified
    note: 'OSDR examples: OSD-11/15/20 (STS-115 Salmonella, Pseudomonas, Candida), OSD-50 (BONEMAC mouse bone-marrow
      cells), OSD-554/627 (P. aeruginosa biofilms).'
ventilation:
  mode:
    value: sealed (closed glass barrel; limited gas exchange; optional gas-permeable membrane / gas-exchange insert)
    unit: '-'
    source: BioServe Space Technologies (Univ. Colorado Boulder), FPA/GAP spaceflight-hardware page (accessed 2026-10-12)
    url: https://www.colorado.edu/center/bioserve/node/47
    quote: The default FPA configuration provides limited gas exchange and can be upgraded with gas permeable membranes
      to further improve performance for experiments with moderate metabolic requirements.
    kind: specified
    note: 'Kim et al. 2013 (PLoS One): "With the solid inserts, the conditions in the FPA are most likely microaerophilic
      to anaerobic as the cells consume the oxygen available in the liquid and air bubble present in the closed
      system." OSD-554: "The use of solid inserts prevents gas exchange and forces anaerobic growth of P. aeruginosa."
      Registry 1173: "It has gas-permeable membranes; however, gas exchange is limited."'
  flow_rate_L_min:
    value: null
    unit: L/min
    note: Not applicable (no forced flow; static culture).
  inlet:
    value: optional gas-exchange (GE) insert with a gas-permeable membrane (replaces the solid insert closing the
      culture chamber)
    unit: '-'
    source: Kim W, Tengra FK, Shong J, et al. (2013) Effect of spaceflight on Pseudomonas aeruginosa final cell
      density is modulated by nutrient and oxygen availability. BMC Microbiol 13:241. doi:10.1186/1471-2180-13-241
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4228280/fullTextXML
    quote: To test this hypothesis, we substituted the solid inserts used in the experiments described above with
      gas exchange (GE) inserts that allow the movement of gases via a gas-permeable membrane.
    kind: specified
    note: Membrane area/material permeance not sourced.
  outlet:
    value: null
    note: None.
  gap_gas_charge:
    value: GAP can be charged with a predefined gas composition
    unit: '-'
    source: BioServe Space Technologies (Univ. Colorado Boulder), FPA/GAP spaceflight-hardware page (accessed 2026-10-12)
    url: https://www.colorado.edu/center/bioserve/node/47
    quote: All components of the GAP and integral FPAs are autoclavable and the GAP can be charged with a predefined
      gas composition to support unique experiment requirements.
    kind: specified
environment:
  temperature_C:
    value: 23
    unit: degC
