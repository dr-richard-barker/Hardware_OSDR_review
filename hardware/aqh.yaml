  h2o_flux:
    value: null
  heat_W:
    value: null

walls:
  material:
    value: null
    note: "Aquarium wall material not found."
  gas_permeability:
    value: null
    note: "Gas exchange is through the artificial lung (gas-permeable membrane); membrane area/permeability not published."

thermal:
  power_W:
    value: null
    note: "AQH power not found. JAXA MSPR page gives a 500 W total shared by Work Volume and Small Experiment Area (rack resource, not AQH draw)."

searched: |
  OSDR snapshot 2026-10-12: SPLASH _id 69; biodata OSD-83, OSD-133 (no registry hardware record).
  JAXA iss.jaxa.jp AQH archive page; JAXA humans-in-space MSPR page; IAC-12 (Sato & Shoji, MHI) and
  IAC-13 (Fujimoto, JAXA) abstracts; Murata et al. 2015 PLoS ONE (PMC4591011); Chatani et al. 2015
  Sci Rep (PMC4585676); Universe Today 2012 article (secondary, not used).
  Not found: AQH external dimensions/mass/power, aquarium inlet/outlet geometry, wall material,
  air-stabilizer volume, artificial-lung area, adult medaka O2 uptake.
