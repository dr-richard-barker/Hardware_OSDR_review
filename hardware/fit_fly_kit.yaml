location:
  value: "Space Shuttle middeck locker, kits in vented stowage foam tray (STS-121, 4-17 July 2006)"
  unit: "-"
  source: "OSDR registry experiment OS-95 'HOBO Combo Data', approach field (snapshot 2026-10-12)"
  url: https://osdr.nasa.gov/geode-py/ws/api/experiment/OS-95
  quote: "The payload was carried in a vented foam tray and located in a middeck locker."
