    value: "polycarbonate fly cassette with a 2 ml food tray, inside a ventilated ESA Type I aluminium container (one cassette per kit)"
    unit: "-"
    source: "OSDR registry hardware 1332, version 'As Flown on STS-121' (snapshot 2026-10-12)"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/1332
    quote: "Each of the ten fly kits consisted of a polycarbonate fly cassette, with a 2ml food tray, inside a TypeI aluminum container developed by the European Space Agency."
    kind: specified
    note: >-
      Marcu et al. 2011 PLoS ONE 6:e15361 (PMC3019151): "Each fly kit, consisted of a polycarbonate fly cassette
      with a 2 ml food tray held in a ventilated aluminum container." SOURCE CONFLICT: the later FFL description
      of the same cassette family says "aluminum body" with polycarbonate lid (registry 1389; NTRS 20190001070
      "Aluminum cassettes").
  specimen_container_mm:
    value: null
    unit: mm
    note: "Cassette dimensions not found."
  food_volume_mL:
    value: 2
    unit: mL per food tray
    source: "OSDR registry hardware 1332, version 'As Flown on STS-121'"
    url: https://osdr.nasa.gov/geode-py/ws/api/hardware/1332
    quote: "a polycarbonate fly cassette, with a 2ml food tray"
    kind: specified
    note: "SOURCE CONFLICT: NASA Researcher's Guide (2016) says Phase I cassette hardware 'only provides 3.4 ml of food'."
  n_specimen_units:
    value: 10
    unit: fly kits (5 with flies, 5 empty for larval transfer) + 1 fungus kit + 1 RAM kit
    source: "OSDR OSD-3 study protocol description (snapshot 2026-10-12)"
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-3/
    quote: "Ten kits (5 with flies and 5 empty) flew on the space shuttle and 10 remained on the ground."
    kind: specified
    note: "Registry 1332: also 'one FIT Fungus Kit (two fungus tubes (10 ml) that are housed in an ESA vented Type 1 Container' and five Food Tray Change Out Platform kits."
  layout:
    value: "kits packed in stowage foam (vented foam tray) inside one middeck locker"
    unit: "-"
    source: "OSDR OSD-3 study protocol description"
    url: https://visualization.osdr.nasa.gov/biodata/api/v2/dataset/OSD-3/
    quote: "The fly kits were placed in stowage foam on the shuttle middeck, at ambient temperature and in total darkness."
    kind: specified

