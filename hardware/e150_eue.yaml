entity_id: HW220
name: E150 Experiment Unique Equipment (EUE) - Animal Walking Apparatus suite (Neurolab)
vendor: NASA Ames Research Center Neurolab payload (builder not stated); PI K. D. Walton, NYU School of Medicine
splash_ids: []
registry_ids: ["998"]
curated: "2026-10-12"

modelling_caveat: >-
  E150 EUE is a behavioural TEST APPARATUS (walking platform + dowels + cameras), not a habitat. It was used for
  short videotaped sessions inside the Spacelab General Purpose Work Station (GPWS). Animals lived in the RAHF
  (PN8 group) or AEM (PN14 group) - those are separate hardware items. Any CFD model of E150 is really a model of
  the GPWS work volume, which is not curated with numbers here.

