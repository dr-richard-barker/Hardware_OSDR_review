specimen:
  type:
    value: "Neonatal rats (Rattus norvegicus): PN8 at launch (RAHF families) and PN14 at launch (2 families with dams, AEM); 16 days in microgravity"
    unit: "-"
    source: "Neurolab Final Report (NTRS 20020073543), sec 2.3 Mammalian Development Team"
    url: https://ntrs.nasa.gov/citations/20020073543
    quote: "Walton was also assigned two families of PN 14 neonates with dams that flew in the AEM"
    kind: specified
    note: >-
      Walton et al. 2003 (NTRS 20030068213) abstract: "We studied two groups of rats that had been raised for 16 days
      in microgravity (eight or 14 days old at launch)". Behaviour sessions on FD6 (older) and FD15 (younger), in the
      GPWS. Animals were marked in 16 places along the body for 2-D video analysis (registry 998).

